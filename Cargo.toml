[package]
name = "mcp-firewall"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A policy-enforcing stdio proxy for Model Context Protocol servers"
license = "MIT"
repository = "https://github.com/dhe-eraj-s/rust-mcp-firewall"
readme = "README.md"
keywords = ["mcp", "security", "llm", "proxy", "firewall"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "io-std", "process", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
